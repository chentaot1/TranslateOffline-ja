name: Feature request
description: Suggest an enhancement or new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The manga reading situation or workflow where the app falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Keep in mind that all ML models run strictly offline on-device with zero network access.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered?
